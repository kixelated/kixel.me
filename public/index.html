<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Luke Curley</title>
		<meta name="description" content="Luke Curley (kixelated): links to MoQ, Kixel, side projects, and socials." />
		<link rel="icon" type="image/svg+xml" href="/avatar.svg" />
		<meta property="og:title" content="Luke Curley" />
		<meta property="og:url" content="https://kixel.me" />

		<style>
			:root {
				color-scheme: dark;
				--bg: #0f172a;
				--ink: #e7ecf3;
				--muted: #8b98ad;
				--orange: #bd6e05;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
				background: var(--bg);
				color: var(--ink);
				font: 18px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			main {
				min-height: 100svh;
				display: grid;
				grid-template-columns: auto auto;
				align-items: center;
				justify-content: center;
				gap: clamp(1rem, 4vw, 4rem);
				padding: 0 1.5rem;
			}

			#cat {
				width: min(92svh, 58vw);
				height: auto;
				display: block;
				overflow: visible;
			}

			#cat .eye {
				transform-box: fill-box;
				transform-origin: center;
				transition: transform 70ms ease-in-out;
			}

			#cat.blink .eye {
				transform: scaleY(0.12);
			}

			h1 {
				font-size: 1.1rem;
				font-weight: 600;
				margin: 0 0 1.5rem;
			}

			nav {
				display: grid;
				grid-template-columns: repeat(2, auto);
				gap: 1.75rem 3rem;
			}

			h2 {
				color: var(--orange);
				font-size: 0.8rem;
				font-weight: 600;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				margin: 0 0 0.4rem;
			}

			ul {
				list-style: none;
				margin: 0;
				padding: 0;
			}

			a {
				color: var(--ink);
				text-decoration: none;
			}

			a:hover,
			a:focus-visible {
				color: var(--orange);
			}

			@media (max-width: 720px) {
				main {
					grid-template-columns: auto;
					justify-items: center;
					align-content: center;
					padding: 0 1.5rem 3rem;
				}

				#cat {
					width: min(100vw - 2rem, 70svh);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<svg id="cat" viewBox="0 0 256 256" role="img" aria-label="Hand-drawn orange cat">
				<g id="face">
					<use href="/avatar.svg#body" />
					<g id="eyes">
						<use class="eye" href="/avatar.svg#eye-l" />
						<use class="eye" href="/avatar.svg#eye-r" />
					</g>
				</g>
			</svg>

			<div>
				<h1>Luke Curley</h1>
				<nav>
					<section>
						<h2>MoQ</h2>
						<ul>
							<li><a href="https://moq.dev">moq.dev</a></li>
							<li><a href="https://moq.pro">moq.pro</a></li>
						</ul>
					</section>
					<section>
						<h2>Company</h2>
						<ul>
							<li><a href="https://kixel.us">kixel.us</a></li>
							<li><a href="https://kixel.ai">kixel.ai</a></li>
						</ul>
					</section>
					<section>
						<h2>Misc</h2>
						<ul>
							<li><a href="https://max.kixel.me">max.kixel.me</a></li>
							<li><a href="https://crabx.kixel.me">crabx.kixel.me</a></li>
						</ul>
					</section>
					<section>
						<h2>Social</h2>
						<ul>
							<li><a rel="me" href="https://github.com/kixelated">GitHub</a></li>
							<li><a rel="me" href="https://x.com/kixelated">X</a></li>
							<li><a rel="me" href="https://bsky.app/profile/kixel.me">Bluesky</a></li>
							<li><a rel="me" href="https://www.linkedin.com/in/luke-curley-635a457/">LinkedIn</a></li>
						</ul>
					</section>
				</nav>
			</div>
		</main>

		<script>
			// The cat leans toward the cursor and its eyes follow, more than the face, for a little depth.
			const cat = document.getElementById("cat");
			const face = document.getElementById("face");
			const eyes = document.getElementById("eyes");

			if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
				const target = { x: 0, y: 0 };
				const now = { x: 0, y: 0 };
				let frame = 0;

				const draw = () => {
					now.x += (target.x - now.x) * 0.12;
					now.y += (target.y - now.y) * 0.12;
					face.style.transform = `translate(${now.x * 3}px, ${now.y * 2}px)`;
					eyes.style.transform = `translate(${now.x * 7}px, ${now.y * 6}px)`;
					cat.style.transform = `perspective(600px) rotateY(${now.x * 6}deg) rotateX(${-now.y * 6}deg)`;
					const settled = Math.abs(target.x - now.x) + Math.abs(target.y - now.y) < 0.001;
					frame = settled ? 0 : requestAnimationFrame(draw);
				};
				const aim = (x, y) => {
					target.x = x;
					target.y = y;
					if (!frame) frame = requestAnimationFrame(draw);
				};

				addEventListener("pointermove", (e) => {
					// Normalize to the cat's center, saturating about a cat-width away.
					const r = cat.getBoundingClientRect();
					const clamp = (v) => Math.max(-1, Math.min(1, v));
					aim(
						clamp((e.clientX - r.left - r.width / 2) / r.width),
						clamp((e.clientY - r.top - r.height / 2) / r.height),
					);
				});
				document.documentElement.addEventListener("pointerleave", () => aim(0, 0));

				const blink = () => {
					cat.classList.add("blink");
					setTimeout(() => cat.classList.remove("blink"), 140);
					setTimeout(blink, 2500 + Math.random() * 5000);
				};
				setTimeout(blink, 2500);
			}
		</script>
	</body>
</html>
